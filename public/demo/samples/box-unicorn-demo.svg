<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-label="演示样例：MGEX Unicorn Gundam Ver.Ka 盒面（合成演示图，非 Bandai 官方素材）">
