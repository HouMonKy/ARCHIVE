<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-label="演示样例：反光模糊盒面（合成演示图，低置信场景）">
  <defs>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a6a"/>
      <stop offset="1" stop-color="#31284a"/>
    </linearGradient>
  </defs>
  <rect width="480" height="640" fill="url(#bg2)"/>
  <text x="40" y="90" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e6e0f0" font-weight="bold">BANDAI</text>
  <text x="40" y="170" font-family="Helvetica, Arial, sans-serif" font-size="56" fill="#ffffff" font-weight="bold">MG 1/100</text>
  <text x="40" y="230" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#d8d2e6">GUNDAM ???</text>
  <text x="40" y="272" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#c5bde0">Ver.Ka</text>
  <g transform="translate(240 430)" opacity="0.9">
    <path d="M-90,60 L-30,-70 L30,-10 L90,-50 L90,60 Z" fill="#9a90b5"/>
    <path d="M-30,-70 L30,-10 L90,-50 L40,-90 Z" fill="#b9b0d0"/>
  </g>
  <rect width="480" height="640" fill="url(#glare)"/>
  <text x="40" y="600" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#efeaf7">GLARE / BLUR SYNTHETIC DEMO SAMPLE</text>
